plugins {
    id "com.android.application"
}

android {
    namespace "io.github.ggak.decoder"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "io.github.ggak.decoder"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            // Extract native libraries before loading. This also supports 16 KB
            // devices when an installer does not preserve APK page alignment.
            useLegacyPackaging true
        }
    }
}
