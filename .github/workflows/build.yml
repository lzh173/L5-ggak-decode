name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build command-line decoder
        run: cmake --build build --target ggak_decode --parallel

      - name: Build ImGui GUI
        run: cmake --build build --target ggak_gui --parallel

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/ggak_decode.exe artifacts/
            cp build/ggak_gui.exe artifacts/
          else
            cp build/ggak_decode artifacts/
            cp build/ggak_gui artifacts/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ggak-${{ runner.os }}
          path: artifacts/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android signing keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          GGAK_ANDROID_KEYSTORE_BASE64: ${{ secrets.GGAK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$GGAK_ANDROID_KEYSTORE_BASE64" || {
            echo "GGAK_ANDROID_KEYSTORE_BASE64 is required for signed push builds" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/ggak-signing"
          printf '%s' "$GGAK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ggak-signing/ggak-release.jks"
          test -s "$RUNNER_TEMP/ggak-signing/ggak-release.jks"

      - name: Build signed Android release APK
        if: github.event_name == 'push'
        working-directory: android
        env:
          GGAK_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ggak-signing/ggak-release.jks
          GGAK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GGAK_ANDROID_KEYSTORE_PASSWORD }}
          GGAK_ANDROID_KEY_ALIAS: ${{ secrets.GGAK_ANDROID_KEY_ALIAS }}
          GGAK_ANDROID_KEY_PASSWORD: ${{ secrets.GGAK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Build Android debug APK for pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify 16 KB native page alignment
        shell: bash
        env:
          APK_PATH: ${{ github.event_name == 'push' && 'android/app/build/outputs/apk/release/app-release.apk' || 'android/app/build/outputs/apk/debug/app-debug.apk' }}
        run: |
          llvm_dir="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          native_dir="android/app/build/intermediates/stripped_native_libs/${{ github.event_name == 'push' && 'release' || 'debug' }}/strip${{ github.event_name == 'push' && 'Release' || 'Debug' }}DebugSymbols/out/lib"
          for library in "$native_dir"/*/libggak_android.so; do
            echo "Checking $library"
            "$llvm_dir/llvm-readelf" -lW "$library" | awk '
              $1 == "LOAD" {
                found = 1
                if ($NF != "0x4000" && $NF != "0x10000") {
                  print "Invalid LOAD alignment: " $NF > "/dev/stderr"
                  bad = 1
                }
              }
              END { exit (!found || bad) }
            '
          done

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 \
            "$APK_PATH"

      - name: Upload signed Android release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ggak-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Android debug APK for pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ggak-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
