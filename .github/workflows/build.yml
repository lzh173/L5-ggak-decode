name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build command-line decoder
        run: cmake --build build --target ggak_decode --parallel

      - name: Build ImGui GUI
        run: cmake --build build --target ggak_gui --parallel

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/ggak_decode.exe artifacts/
            cp build/ggak_gui.exe artifacts/
          else
            cp build/ggak_decode artifacts/
            cp build/ggak_gui artifacts/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ggak-${{ runner.os }}
          path: artifacts/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify 16 KB native page alignment
        shell: bash
        run: |
          llvm_dir="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for library in android/app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/*/libggak_android.so; do
            echo "Checking $library"
            "$llvm_dir/llvm-readelf" -lW "$library" | awk '
              $1 == "LOAD" {
                found = 1
                if ($NF != "0x4000" && $NF != "0x10000") {
                  print "Invalid LOAD alignment: " $NF > "/dev/stderr"
                  bad = 1
                }
              }
              END { exit (!found || bad) }
            '
          done

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ggak-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
